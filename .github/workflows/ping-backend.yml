name: Ping Backend Lavanderia

on:
  schedule:
    # PRUEBA: hoy viernes a la 1pm SDQ (17:00 UTC)
    - cron: '0 17 15 5 *'
    # Lunes a viernes 8am-8pm SDQ (UTC-4 = 12:00-23:00 UTC)
    - cron: '0,14,28,42,56 12-23 * * 1-5'
    # Sábado 8am-5pm SDQ (UTC-4 = 12:00-21:00 UTC)
    - cron: '0,14,28,42,56 12-21 * * 6'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up backend
        run: |
          curl --max-time 90 --retry 3 --retry-delay 15 \
          https://demo-lavanderia-backend.onrender.com/health
